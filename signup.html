<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - NEXUS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gradient-to-br from-zinc-50 to-zinc-100 dark:from-zinc-950 dark:to-zinc-900 text-zinc-900 antialiased transition-colors duration-300 min-h-screen overflow-x-hidden flex flex-col relative z-0" style="font-family: 'Inter', sans-serif;">

    <!-- Background Glassy Orbs -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] aspect-square bg-gradient-to-br from-zinc-200/50 to-transparent dark:from-zinc-800/40 rounded-full blur-3xl"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] aspect-square bg-gradient-to-tl from-zinc-200/50 to-transparent dark:from-zinc-800/40 rounded-full blur-3xl"></div>
    </div>

    <!-- Auth Page -->
    <div class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-sm p-8 bg-white/80 backdrop-blur-xl dark:bg-zinc-900/80 border border-white/60 dark:border-zinc-800/60 rounded-xl shadow-lg">
            <div class="font-semibold tracking-tighter text-xl mb-6 text-center">NEXUS</div>
            
            <h2 class="text-xl font-semibold tracking-tight mb-1 text-center">Create an account</h2>
            <p class="text-sm text-zinc-500 dark:text-zinc-400 text-center mb-6">Enter your details to register.</p>

            <form id="auth-form" onsubmit="handleSignup(event)" class="space-y-4">
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-zinc-700 dark:text-zinc-300">Full Name</label>
                    <input type="text" id="auth-name" required class="w-full bg-white/50 dark:bg-zinc-950/50 border border-zinc-300/50 dark:border-zinc-700/50 rounded-md px-3 py-1.5 text-sm outline-none focus:border-zinc-900 dark:focus:border-zinc-100 transition-colors placeholder:text-zinc-400 backdrop-blur-sm" placeholder="John Doe">
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-zinc-700 dark:text-zinc-300">Email Address</label>
                    <input type="email" id="auth-email" required class="w-full bg-white/50 dark:bg-zinc-950/50 border border-zinc-300/50 dark:border-zinc-700/50 rounded-md px-3 py-1.5 text-sm outline-none focus:border-zinc-900 dark:focus:border-zinc-100 transition-colors placeholder:text-zinc-400 backdrop-blur-sm" placeholder="name@example.com">
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-zinc-700 dark:text-zinc-300">Password</label>
                    <input type="password" id="auth-pass" required class="w-full bg-white/50 dark:bg-zinc-950/50 border border-zinc-300/50 dark:border-zinc-700/50 rounded-md px-3 py-1.5 text-sm outline-none focus:border-zinc-900 dark:focus:border-zinc-100 transition-colors placeholder:text-zinc-400 backdrop-blur-sm" placeholder="••••••••">
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-zinc-700 dark:text-zinc-300">Confirm Password</label>
                    <input type="password" id="auth-confirm" required class="w-full bg-white/50 dark:bg-zinc-950/50 border border-zinc-300/50 dark:border-zinc-700/50 rounded-md px-3 py-1.5 text-sm outline-none focus:border-zinc-900 dark:focus:border-zinc-100 transition-colors placeholder:text-zinc-400 backdrop-blur-sm" placeholder="••••••••">
                </div>
                
                <div id="auth-error" class="hidden text-xs text-red-500 font-medium"></div>

                <button type="submit" class="w-full bg-zinc-900/90 backdrop-blur-sm text-zinc-50 hover:bg-zinc-800 dark:bg-zinc-100/90 dark:text-zinc-900 dark:hover:bg-zinc-200 py-2 rounded-md text-sm font-medium transition-colors shadow-sm mt-2">Sign Up</button>
            </form>
            
            <div class="mt-6 text-center text-sm text-zinc-500">
                <span>Already have an account?</span> 
                <button onclick="navigateTo('login')" class="font-medium text-zinc-900 dark:text-zinc-100 hover:underline">Log in</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
